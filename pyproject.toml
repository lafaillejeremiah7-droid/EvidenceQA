[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evidenceqa"
version = "0.1.0"
description = "Local, citation-first document question answering"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf>=5"]

[project.scripts]
evidenceqa = "evidenceqa.cli:main"

[tool.setuptools.packages.find]
include = ["evidenceqa*"]
